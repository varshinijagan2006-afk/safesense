services:
  - type: web
    name: safesense-platform
    env: python
    buildCommand: "./build.sh"
    startCommand: "python -m uvicorn backend.main:app --host 0.0.0.0 --port $PORT"
    envVars:
      - key: PYTHON_VERSION
        value: 3.10.12
      - key: NODE_VERSION
        value: 20.10.0
      - key: ALLOWED_ORIGINS
        value: "*"
